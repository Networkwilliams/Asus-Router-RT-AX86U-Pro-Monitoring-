# Telegraf Configuration for ASUS RT-AX86U Pro Router

[global_tags]
  host = "asus-router"
  router_model = "RT-AX86U-Pro"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "asus-router"
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

[[outputs.influxdb_v2]]
  urls = ["http://192.168.0.200:8086"]
  token = "my-super-secret-auth-token-change-this"
  organization = "home"
  bucket = "router_metrics"
  timeout = "5s"

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# CPU Usage
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# Memory Usage
[[inputs.mem]]

# Disk Usage (USB and internal)
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Disk I/O
[[inputs.diskio]]

# System Load
[[inputs.system]]

# Network Interface Statistics
[[inputs.net]]
  interfaces = ["eth0", "eth1", "eth2", "eth3", "eth4", "eth5", "br0", "ppp0"]
  ignore_protocol_stats = false

# Network Statistics
[[inputs.netstat]]

# Process Statistics
[[inputs.processes]]

# Kernel Statistics
[[inputs.kernel]]

# Temperature Sensors
[[inputs.sensors]]

# Custom Wireless Statistics using exec plugin
[[inputs.exec]]
  commands = ["/opt/scripts/wireless_stats.sh"]
  timeout = "5s"
  data_format = "influx"
  interval = "30s"

# Custom Connected Clients using exec plugin
[[inputs.exec]]
  commands = ["/opt/scripts/client_stats.sh"]
  timeout = "5s"
  data_format = "influx"
  interval = "30s"

# Custom WAN Statistics
[[inputs.exec]]
  commands = ["/opt/scripts/wan_stats.sh"]
  timeout = "5s"
  data_format = "influx"
  interval = "10s"

# Connection Tracking
[[inputs.conntrack]]
  files = ["ip_conntrack_count", "ip_conntrack_max"]
  dirs = ["/proc/sys/net/ipv4/netfilter", "/proc/sys/net/netfilter"]
